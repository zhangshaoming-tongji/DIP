<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第8次课 频域分析 · 课堂演示</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <p class="kicker">数字图像处理 · 作业辅导 · 频域分析</p>
      <h1>理解 DFT、循环卷积与频域滤波</h1>
    </div>
    <div class="source-bar">
      <label>演示图像
        <select id="sourceSelect">
          <option value="lena">Lena</option>
          <option value="camera">Cameraman</option>
          <option value="zone">波带片</option>
          <option value="stripes">文档条纹</option>
          <option value="rect">横向方块</option>
        </select>
      </label>
      <button type="button" id="openBtn">打开本地图片</button>
      <button type="button" id="codeBtn" class="ghost">放大代码</button>
      <input id="fileInput" type="file" accept="image/*" hidden />
    </div>
  </header>
  <p id="banner" class="banner" hidden></p>
  <nav id="groups" class="groups"></nav>
  <nav id="demos" class="demos"></nav>
  <main>
    <section class="stage">
      <figure><figcaption id="cap0"></figcaption><canvas id="c0"></canvas></figure>
      <figure><figcaption id="cap1"></figcaption><canvas id="c1"></canvas></figure>
      <figure><figcaption id="cap2"></figcaption><canvas id="c2"></canvas></figure>
      <figure><figcaption id="cap3"></figcaption><canvas id="c3"></canvas></figure>
    </section>
    <aside>
      <h2 id="demoTitle"></h2>
      <p id="question" class="question"></p>
      <div id="controls"></div>
      <p id="formula" class="formula"></p>
      <p id="note" class="note"></p>
      <p id="stats" class="stats"></p>
      <pre id="nums" class="nums" hidden></pre>
      <div id="codeTabs" class="code-tabs"></div>
      <pre id="code" class="code"></pre>
    </aside>
  </main>
  <script src="fft.js"></script>
  <script src="filters.js"></script>
  <script src="app.js"></script>
</body>
</html>
